name: Bug report
description: Something in jobscout does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if the app will not open at all, check the install notes
        in the README first — the unsigned builds on macOS and Windows account
        for most first-run failures.

  - type: input
    id: version
    attributes:
      label: jobscout version
      description: The release you downloaded, e.g. v0.3.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux (AppImage)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: e.g. macOS 15.3, Windows 11 23H2, Ubuntu 24.04, Arch
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: >
        If the app fails to start, run it from a terminal and paste what it
        prints. This is rendered as a code block, so no backticks needed.
      render: text
