# Build jobscout from the private source repository and publish the release
# here.
#
# The source lives in Souvikns/jobscout and never appears in this repository —
# each job clones it onto the runner with a read-only token and only the
# compiled artifacts are kept. Running the build here rather than in the
# private repo is what makes it free: Actions minutes are unmetered for public
# repositories, and macOS runners would otherwise bill at 10x.
#
# Cut a release with:
#   gh workflow run release.yml --repo Souvikns/findmejob -f tag=v0.3.0
# The tag must already exist in the private repository.
#
# SECURITY NOTES — read before editing this file:
#   * Logs of a public repository are world-readable, and a failing Go or npm
#     build prints source lines. Treat a red build as a possible disclosure of
#     that snippet.
#   * Never add a `pull_request_target`, `issue_comment` or fork-triggered
#     `pull_request` trigger. Those run attacker-supplied input in a context
#     that can read RELEASE_REPO_TOKEN, which would hand over the private
#     source. workflow_dispatch can only be started by someone with write
#     access here.
#   * Only pin trusted actions. Any third-party action added below can read
#     every secret this workflow holds.
#
# Required secrets in THIS repository:
#   RELEASE_REPO_TOKEN         fine-grained PAT, Contents: READ on
#                              Souvikns/jobscout only. The name is historical —
#                              it reads the source, it does not publish; the
#                              release is created with GITHUB_TOKEN below.
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, JOBSCOUT_API_URL
#                              compiled into the binaries with -ldflags
#   OAUTH_CALLBACK_PORT        optional
#
# The release itself is created with the built-in GITHUB_TOKEN — no extra token
# is needed for that, because the release lands in this repository.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag in the private source repo to build and release
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: Souvikns/jobscout
  WAILS_VERSION: v2.15.0
  TAG: ${{ github.event.inputs.tag }}

jobs:
  # ---------------------------------------------------------------- macOS ----
  # One universal binary covers Intel and Apple Silicon, so there is no reason
  # to ship separate downloads. The .app is not signed or notarized — see the
  # quarantine note that ships inside the .dmg.
  macos:
    runs-on: macos-15
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          persist-credentials: false

      - uses: ./.github/actions/prepare
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          api-url: ${{ secrets.JOBSCOUT_API_URL }}
          oauth-callback-port: ${{ secrets.OAUTH_CALLBACK_PORT }}
          version: ${{ env.TAG }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build (darwin/universal)
        run: wails build -platform darwin/universal -s -clean -ldflags "$LDFLAGS"

      # The asset filenames below are a contract with two other places: the
      # download page (web/src/release.js) and the app's in-app updater
      # (internal/updater/github.go in the private source repo), both of which
      # match on their suffixes. Renaming one here stops installed copies from
      # updating, with no error anywhere. The macOS .zip is what the updater
      # installs; the .dmg is for a person to drag from.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/jobscout.app "dist/jobscout_${TAG}_macos_universal.zip"
          scripts/make-dmg.sh build/bin/jobscout.app "$TAG" dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- Windows ----
  # amd64 only, and only the NSIS installer — the portable .zip and the arm64
  # build were dropped to keep the download page down to one obvious choice
  # per platform.
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          persist-credentials: false

      - uses: ./.github/actions/prepare
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          api-url: ${{ secrets.JOBSCOUT_API_URL }}
          oauth-callback-port: ${{ secrets.OAUTH_CALLBACK_PORT }}
          version: ${{ env.TAG }}

      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # The runner image usually ships NSIS, but install it when it does not
      # rather than let a future image change silently drop the installer.
      #
      # pwsh, not bash: GITHUB_PATH only affects *later* steps, so the check has
      # to be split in two, and MSYS bash rewrites makensis' /VERSION argument
      # into a filesystem path.
      - name: Ensure NSIS is present
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "$nsis\makensis.exe")) {
              choco install nsis -y --no-progress
            }
            $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify NSIS
        shell: pwsh
        run: makensis /VERSION

      - name: Build (windows/amd64)
        shell: bash
        run: wails build -platform windows/amd64 -s -nsis -ldflags "$LDFLAGS" -o jobscout.exe

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          installer=$(ls build/bin/*installer*.exe 2>/dev/null | head -1 || true)
          if [ -z "$installer" ]; then
            echo "::error::wails produced no NSIS installer"
            exit 1
          fi
          cp "$installer" "dist/jobscout_${TAG}_windows_amd64_setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux ----
  # One AppImage, and nothing else. It bundles its own GTK and WebKitGTK, which
  # is what makes a single Linux download possible at all: linking against the
  # system WebKitGTK would mean shipping separate builds for the incompatible
  # 4.0 and 4.1 ABIs, in each of .deb, .rpm and .pkg.tar.zst.
  #
  # The compile still happens in the container (Wails needs cgo against the
  # GTK/WebKit headers), then linuxdeploy bundles the runner's copies of those
  # libraries into the image. Both halves live in one job so the binary does not
  # have to travel through an artifact.
  #
  # This job is NOT continue-on-error: it is the only Linux artifact, so a
  # failure here has to stop the release rather than quietly publish without it.
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          persist-credentials: false

      - uses: ./.github/actions/prepare
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          api-url: ${{ secrets.JOBSCOUT_API_URL }}
          oauth-callback-port: ${{ secrets.OAUTH_CALLBACK_PORT }}
          version: ${{ env.TAG }}

      - name: Build (linux/amd64, webkit 4.1)
        run: scripts/build-linux.sh amd64 4.1 staging/jobscout

      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 librsvg2-dev desktop-file-utils \
            imagemagick

      - name: Build AppImage
        run: |
          mkdir -p dist
          scripts/make-appimage.sh staging/jobscout "$TAG" dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: dist/*
          if-no-files-found: error

  # --------------------------------------------------------------- Publish ---
  publish:
    runs-on: ubuntu-latest
    needs: [macos, windows, linux]
    steps:
      # Only the release-notes template is needed from the source repo here.
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TAG }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          set -euo pipefail
          # The notes live outside dist/ so they are neither checksummed nor
          # uploaded as an asset.
          sed "s|@TAG@|$TAG|g; s|@RELEASE_REPO@|${{ github.repository }}|g" \
            .github/release-notes.md.in > "$RUNNER_TEMP/NOTES.md"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The workspace holds a clone of the private repo, so --repo is
          # required; without it gh would target the wrong repository.
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "jobscout $TAG" \
            --notes-file "$RUNNER_TEMP/NOTES.md"
