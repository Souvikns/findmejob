<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="jobscout">
  <!--
    The mark is the mechanism at 16px: a short list with one row marked.
    Two rows sit in ash, one runs the full measure in the strong band's green.
    Colour means a band here exactly as it does on the site.
  -->
  <rect width="32" height="32" rx="7" fill="#0d0d0d" />
  <rect x="7" y="8" width="11" height="3" rx="1.5" fill="#434345" />
  <rect x="7" y="14.5" width="18" height="3" rx="1.5" fill="#59d499" />
  <rect x="7" y="21" width="9" height="3" rx="1.5" fill="#434345" />
</svg>
